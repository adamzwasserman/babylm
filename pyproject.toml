[project]
name = "babylm"
version = "0.1.0"
description = "Right Tool, Right Job: BabyLM 2026 Strict-track submission (MÉTRON-FR)"
requires-python = ">=3.13"
dependencies = [
    "datasets",
    "huggingface_hub",
    "transformers",
    "torch",
    "sentencepiece",
    "spacy",
    "pylangacq",
    "requests",
    "tqdm",
    "numpy",
    "pandas",
    "pymysql>=1.1.2",
    "wandb>=0.18",
    "peft>=0.13",
    "evaluate>=0.4",
    "scikit-learn>=1.5",
    "accelerate>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long lines tolerated outside critical paths

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
